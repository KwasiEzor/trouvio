# Porte de qualité de chaque PR et de main (P0-04). Aucun secret requis.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Annule un run de PR remplacé par un push plus récent ; jamais sur main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Postgres des tests d'intégration (projet Vitest db, ADR 0012) : même image, au même digest,
    # que db/local/compose.yaml (local-parity.test.ts). Identifiants jetables, aucune donnée réelle.
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Garde-fous de Claude (.claude/hooks) : refus attendus et contre-épreuves, ici sous bash 5,
      # grep GNU et mawk (écarts de portabilité avec le poste macOS détectés en CI). P0-07.
      - run: bash scripts/test-hooks.sh
      # Version de pnpm lue dans package.json (packageManager).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rôle trouvio non superutilisateur et base trouvio_dev, comme en local (db/local/init.sql).
      - run: psql -v ON_ERROR_STOP=1 -f db/local/init.sql
        env:
          PGHOST: 127.0.0.1
          PGPORT: "54329"
          PGUSER: postgres
          PGPASSWORD: postgres
      # Identique au poste local : lint, typecheck, dérive des migrations, tests + couverture
      # (projet db sur le service Postgres, TEST_DATABASE_URL par défaut), format, build.
      - run: pnpm verify

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Postgres du serveur testé (P1-02 : sessions et comptes en base). Même image, au même digest,
    # et même initialisation que le job quality (local-parity.test.ts). La base trouvio_e2e est
    # recréée et migrée par `pnpm e2e:prepare` (playwright.config.ts). Identifiants jetables,
    # secret d'authentification tiré à chaque exécution : aucun secret GitHub.
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql -v ON_ERROR_STOP=1 -f db/local/init.sql
        env:
          PGHOST: 127.0.0.1
          PGPORT: "54329"
          PGUSER: postgres
          PGPASSWORD: postgres
      # Pas de cache des navigateurs (déconseillé par Playwright) ; headless shell seul.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
